guide: optimized-baseline
namespace: llm-d-bench
version: v0.8.1

model:
  name: openai/gpt-oss-120b
  source: pvc
  pvc_name: model-pvc
  mount_path: /mnt/models
  # To use hostpath instead, switch source and uncomment:
  # source: hostpath
  # host_path: /var/lib/mlperf/models

modelserver:
  accelerator: gpu
  engine: vllm
  infra_provider: gpt-oss
  replicas: 1
  tensor_parallel_size: 1
  gpu_count: 4
  numa_pinning: false

  cpu_limit: ""
  cpu_request: "32"
  memory_limit: ""
  memory_request: 64Gi
  shm_size: 20Gi
  vllm_args:
    - "--max-model-len=49000"
    - "--max-num-seqs=2048"
    - "--gpu-memory-utilization=0.98"
    - "--kv-cache-dtype=fp8"
    - "--moe-backend=flashinfer_trtllm"
    - "--quantization_config.moe.activation=mxfp8"
    - "--max-cudagraph-capture-size=2048"
    - "--max-num-batched-tokens=8192"
    - "--no-enable-prefix-caching"
    - "--data-parallel-size=4"
    - "--pipeline-parallel-size=1"
    - "--enable-expert-parallel"

router:
  mode: standalone
  epp_config: epp-configs/mlperf-v60.yaml
